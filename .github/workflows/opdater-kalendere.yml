name: Opdater kampkalendere

on:
  schedule:
    - cron: "0 0 * * *"   # hver dag kl. 00:00 UTC (kl. 01:00 eller 02:00 dansk tid afhængigt af hhv. vinter-/sommertid)
  workflow_dispatch:      # gør at du også kan trykke "Run workflow" manuelt

permissions:
  contents: write

jobs:
  opdater:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt R op
        uses: r-lib/actions/setup-r@v2

      - name: Kør script (installerer selv manglende R-pakker)
        run: Rscript kalendere.R

      - name: Commit og push opdaterede filer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.ics'
          git diff --staged --quiet || git commit -m "Automatisk opdatering af kampkalendere"
          git push